profile_policy:
  tokens:
  - 0
  - 12
  - 28
  decodes:
  - 0
  - 2
  min_samples: 3
  recent_window: 4
  drift_lower: 0.8
  drift_upper: 1.25
runtime:
  owner: router-local
  max_age_us: 150000
  calibration:
    alpha: 0.5
    lower: 0.5
    upper: 2
    window_samples: 3
    drift_lower: 0.8
    drift_upper: 1.25
  profile_source: notebook
  notebook_dir: captures/capture-5
