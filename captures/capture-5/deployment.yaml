targets:
- endpoint_id: a
  url: http://a:8100
  model: shared-model
  revision: r-0
  tokenizer: codepoint-v1
  accelerator: gpu-0
  parallelism: 1
  quantization: fp16
  transport_us: 7
- endpoint_id: b
  url: http://b:8100
  model: shared-model
  revision: r-1
  tokenizer: utf8-v1
  accelerator: gpu-1
  parallelism: 2
  quantization: fp16
  transport_us: 10
- endpoint_id: c
  url: http://c:8100
  model: shared-model
  revision: r-2
  tokenizer: codepoint-v1
  accelerator: gpu-2
