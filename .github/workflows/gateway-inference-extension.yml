name: Gateway Inference Extension

on:
  pull_request:
    paths:
      - '.github/workflows/gateway-inference-extension.yml'
      - 'src/gateway_inference_extension/**'
      - 'tests/e2e/assets/gateway-inference-extension-simulator.yaml'
      - 'tests/e2e/run-gateway-inference-extension-test.sh'
      - 'tutorials/21-gateway-inference-extension.md'
      - 'docs/source/deployment/gateway-inference-extension.rst'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gateway-inference-extension.yml'
      - 'src/gateway_inference_extension/**'
      - 'tests/e2e/assets/gateway-inference-extension-simulator.yaml'
      - 'tests/e2e/run-gateway-inference-extension-test.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Agentgateway smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Install kind and kubectl
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - name: Run Gateway Inference Extension smoke test
        run: ./tests/e2e/run-gateway-inference-extension-test.sh
