name: Gateway Inference Extension

on:
  pull_request:
    paths:
      - '.github/workflows/gateway-inference-extension.yml'
      - 'src/gateway_inference_extension/**'
      - 'tests/e2e/assets/gateway-inference-extension-simulator.yaml'
      - 'tests/e2e/run-gateway-inference-extension-test.sh'
      - 'tutorials/21-gateway-inference-extension.md'
      - 'docs/source/deployment/gateway-inference-extension.rst'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gateway-inference-extension.yml'
      - 'src/gateway_inference_extension/**'
      - 'tests/e2e/assets/gateway-inference-extension-simulator.yaml'
      - 'tests/e2e/run-gateway-inference-extension-test.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Agentgateway smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kind and kubectl
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: Run Gateway Inference Extension smoke test
        run: ./tests/e2e/run-gateway-inference-extension-test.sh
